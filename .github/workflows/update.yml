name: update
# GitHub 예약 실행(cron)은 10분 간격을 자주 건너뛴다(2026-10-07 하루 종일 0회).
# 그래서 작업 하나가 ~5시간 동안 10분마다 직접 갱신하고, 끝나면 다음 회차를 스스로 실행한다.
# 아래 cron 은 사슬이 끊겼을 때 다시 살리는 백업용.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "텔레그램 테스트 메시지만 보내기"
        type: boolean
        default: false
permissions:
  contents: write   # gh-pages 브랜치에 화면 올리기
  actions: write    # 다음 회차 실행
concurrency: update  # 한 번에 한 회차만 (나머지는 대기)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # 알림 중복 방지 기록(state.json)·한국은행 지표(ecos.json)를 회차 사이에 이어받기
      - uses: actions/cache@v4
        with:
          path: |
            state.json
            ecos.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - if: inputs.ping
        run: python watch.py --ping
      - name: 75초마다 시세(live 브랜치), 10분마다 차트(gh-pages) — 약 5시간
        run: |
          git config --global user.name watchlist-bot
          git config --global user.email watchlist-bot@users.noreply.github.com
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in $(seq 0 239); do
            if [ $((i % 8)) -eq 0 ]; then
              python watch.py || true
              rm -rf site && mkdir site && cp index.html manifest.json icon.png icon-192.png sw.js site/ && touch site/.nojekyll
              (cd site && git init -q -b gh-pages && git add -A && git commit -qm "차트" && git push -qf "$REPO" gh-pages) || true
            fi
            python watch.py --live || true
            rm -rf livedir && mkdir livedir && cp live.json livedir/
            (cd livedir && git init -q -b live && git add -A && git commit -qm "시세" && git push -qf "$REPO" live) || true
            sleep 70
          done
      - name: 다음 회차 실행
        if: always()
        run: gh workflow run update.yml -R ${{ github.repository }}
