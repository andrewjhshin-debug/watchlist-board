name: update
# GitHub 예약 실행(cron)은 10분 간격을 자주 건너뛴다(2026-10-07 하루 종일 0회).
# 그래서 작업 하나가 ~5시간 동안 10분마다 직접 갱신하고, 끝나면 다음 회차를 스스로 실행한다.
# 아래 cron 은 사슬이 끊겼을 때 다시 살리는 백업용.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write   # gh-pages 브랜치에 화면 올리기
  actions: write    # 다음 회차 실행
concurrency: update  # 한 번에 한 회차만 (나머지는 대기)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      # 한국은행 지표(ecos.json, 하루 1번)와 한투 토큰(.kis.enc, 24시간)을 회차 사이에 이어받기.
      # 한투 토큰은 '1일 1회 발급 원칙'이라 재사용해야 함. 주문도 가능한 토큰이라 APP SECRET 으로 암호화해서만 보관
      - uses: actions/cache@v4
        with:
          path: |
            ecos.json
            .kis.enc
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: 한투 토큰 복원
        run: |
          [ -f .kis.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KIS_APP_SECRET -in .kis.enc -out .kis.json || true
      - name: 1분마다 시세(live 브랜치, 분마다 새 파일), 10분마다 차트(gh-pages) — 약 5시간
        run: |
          git config --global user.name watchlist-bot
          git config --global user.email watchlist-bot@users.noreply.github.com
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in $(seq 0 279); do
            if [ $((i % 10)) -eq 0 ]; then
              python watch.py || true
              rm -rf site && mkdir site && cp index.html manifest.json icon.png icon-192.png sw.js site/ && touch site/.nojekyll
              (cd site && git init -q -b gh-pages && git add -A && git commit -qm "차트" && git push -qf "$REPO" gh-pages) || true
            fi
            python watch.py --live || true
            (cd livedir && rm -rf .git && git init -q -b live && git add -A && git commit -qm "시세" && git push -qf "$REPO" live) || true
            sleep 50
          done
      - name: 한투 토큰 암호화해서 보관
        if: always()
        run: |
          [ -f .kis.json ] && openssl enc -aes-256-cbc -pbkdf2 -pass env:KIS_APP_SECRET -in .kis.json -out .kis.enc && rm -f .kis.json || true
      - name: 다음 회차 실행
        if: always()
        run: gh workflow run update.yml -R ${{ github.repository }}
