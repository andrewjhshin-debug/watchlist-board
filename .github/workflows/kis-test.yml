name: kis-test
# 한투 키 점검용(수동 실행). 토큰·키는 출력하지 않고, 받아온 가격만 찍는다.
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'EOF'
          import json, urllib.request, watch
          h = watch.kis_headers("HHDFS00000300")
          print("토큰:", "OK" if h else "키 없음")
          for ex in ["BAQ", "BAY", "BAA", "NAS", "NYS", "AMS"]:
              for sym in ["SOXL", "AXTX", "USDE", "SDEV"]:
                  url = f"{watch.KIS}/uapi/overseas-price/v1/quotations/price?AUTH=&EXCD={ex}&SYMB={sym}"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20) as r:
                          j = json.load(r)
                      o = j.get("output") or {}
                      print(ex, sym, "last", o.get("last"), "base", o.get("base"), j.get("msg1", ""))
                  except Exception as e:
                      print(ex, sym, "에러", type(e).__name__)
          EOF
