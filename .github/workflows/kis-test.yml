name: kis-test
# 한투 해외주식 분봉 점검(수동). 저장된 토큰을 복원해서 쓰므로 새로 발급하지 않음. 가격만 출력
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ecos.json
            .kis.enc
          key: state-none
          restore-keys: state-
      - run: |
          [ -f .kis.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KIS_APP_SECRET -in .kis.enc -out .kis.json || true
          python - <<'EOF'
          import json, os, urllib.request, watch
          st = watch.kis_state(); print("저장 토큰:", "있음" if st.get("tok") else "없음", st.get("exp"))
          if not st.get("tok"):
              raise SystemExit("토큰 없음 — 새로 발급하지 않고 종료")
          h = watch.kis_headers("HHDFS76950200")
          for ex in ["AMS", "BAA"]:
              for nmin in ["240", "60"]:
                  url = (f"{watch.KIS}/uapi/overseas-price/v1/quotations/inquire-time-itemchartprice"
                         f"?AUTH=&EXCD={ex}&SYMB=SOXL&NMIN={nmin}&PINC=1&NEXT=&NREC=120&FILL=&KEYB=")
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20) as r:
                          j = json.load(r)
                      rows = j.get("output2") or []
                      print(ex, nmin, j.get("rt_cd"), j.get("msg1"), "rows", len(rows))
                      for x in rows[:4] + rows[-2:]:
                          print("   ", x.get("xymd"), x.get("xhms"), x.get("kymd"), x.get("khms"), "o", x.get("open"), "h", x.get("high"), "l", x.get("low"), "c", x.get("last"))
                  except Exception as e:
                      print(ex, nmin, "에러", type(e).__name__)
          EOF
